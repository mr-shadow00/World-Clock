<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>World Clock</title>
<meta name="description" content="Time in every city that matters to you, synced from multiple time servers." />
<meta name="theme-color" content="#150d1a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="World Clock" />
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('wc-theme-v2');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs></svg>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="26" height="26">
            <circle cx="20" cy="20" r="17" fill="none" stroke="var(--accent-gold)" stroke-width="2.4"/>
            <path d="M20 20 L20 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M20 20 L27 24" stroke="var(--accent-teal)" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <h1>World Clock</h1>
      </div>
      <div class="topbar-actions">
        <button class="sync-pill" id="syncPill" type="button" title="Sync status">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">Syncing…</span>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
        <div class="menu-wrap">
          <button class="icon-btn" id="menuBtn" title="More" aria-label="More options">⋯</button>
          <div class="popover" id="menuPopover" hidden>
            <button data-action="addAll">Add all timezones</button>
            <button data-action="removeAll" class="popover-danger">Remove all timezones</button>
            <button data-action="refresh">Force re-sync</button>
            <button data-action="export">Export backup</button>
            <label class="popover-file">
              Import backup
              <input type="file" id="importFile" accept="application/json" hidden />
            </label>
          </div>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Clock views">
      <button class="tab" id="tabPinned" role="tab" data-tab="pinned" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><use href="#i-pin"/></svg>
        Pinned <span class="tab-count" id="countPinned">0</span>
      </button>
      <button class="tab" id="tabAll" role="tab" data-tab="all" type="button">
        All clocks <span class="tab-count" id="countAll">0</span>
      </button>
    </nav>

    <div class="search-row">
      <div class="grid-search">
        <svg class="grid-search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="gridSearch" placeholder="Search city or country…" autocomplete="off" aria-label="Search clocks" />
        <button class="grid-search-clear" id="gridSearchClear" type="button" aria-label="Clear search" hidden>✕</button>
      </div>
      <button class="travel-toggle" id="travelToggle" type="button" aria-expanded="false" aria-controls="travelPanel">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="travelToggleText">Time travel</span>
      </button>
    </div>

    <section class="travel" id="travelPanel" hidden aria-label="Time travel">
      <div class="travel-head">
        <div>
          <div class="travel-readout" id="travelReadout">Now</div>
          <div class="travel-sub" id="travelSub">Drag the slider to see every clock at another moment</div>
        </div>
        <button class="btn-ghost travel-reset" id="travelReset" type="button">Back to now</button>
      </div>
      <input type="range" id="travelSlider" min="-1440" max="2880" step="15" value="0" aria-label="Move time forward or backward" />
      <div class="travel-scale" aria-hidden="true">
        <span style="left:0;transform:none">−24h</span>
        <span style="left:33.333%">Now</span>
        <span style="left:66.667%">+24h</span>
        <span style="left:100%;transform:translateX(-100%)">+48h</span>
      </div>
      <div class="travel-steps">
        <button type="button" data-step="-60">−1h</button>
        <button type="button" data-step="-15">−15m</button>
        <button type="button" data-step="15">+15m</button>
        <button type="button" data-step="60">+1h</button>
      </div>
    </section>

    <main class="clock-grid" id="clockGrid" aria-live="polite"></main>

    <div class="empty-state" id="emptyState" hidden>
      <p id="emptyStateTitle">No clocks yet</p>
      <span id="emptyStateSub">Tap the + button to add a city</span>
      <button class="btn-ghost" id="emptyAction" type="button" hidden>Browse all clocks</button>
    </div>

    <button class="fab" id="addBtn" title="Add a clock" aria-label="Add a clock">+</button>
  </div>


  <!-- Sync detail sheet -->
  <div class="sheet-backdrop" id="syncBackdrop" hidden>
    <div class="sheet" id="syncSheet" role="dialog" aria-label="Time sync detail">
      <div class="sheet-handle"></div>
      <h2>Time sync</h2>
      <p class="sheet-sub" id="syncSummary"></p>
      <div class="source-list" id="sourceList"></div>
      <button class="btn-primary" id="syncNowBtn">Re-sync now</button>
      <button class="btn-ghost" data-close="sync">Close</button>
    </div>
  </div>

  <!-- Add clock sheet -->
  <div class="sheet-backdrop" id="addBackdrop" hidden>
    <div class="sheet" id="addSheet" role="dialog" aria-label="Add a clock">
      <div class="sheet-handle"></div>
      <h2>Add a clock</h2>
      <input type="search" id="tzSearch" placeholder="Search city or region…" autocomplete="off" />
      <button class="btn-primary" id="addAllBtn">Add all timezones</button>
      <div class="tz-list" id="tzList"></div>
      <button class="btn-ghost" data-close="add">Cancel</button>
    </div>
  </div>

  <!-- Rename sheet -->
  <div class="sheet-backdrop" id="renameBackdrop" hidden>
    <div class="sheet" id="renameSheet" role="dialog" aria-label="Rename clock">
      <div class="sheet-handle"></div>
      <h2>Rename clock</h2>
      <input type="text" id="renameInput" placeholder="Label" maxlength="40" />
      <button class="btn-primary" id="renameSaveBtn">Save</button>
      <button class="btn-danger" id="renameDeleteBtn">Remove clock</button>
      <button class="btn-ghost" data-close="rename">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
